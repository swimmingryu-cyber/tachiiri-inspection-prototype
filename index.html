<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c36"><title>立入検査サポート | 試作</title>
<style>
:root{--green:#14594d;--deep:#123c36;--mint:#e9f5ef;--paper:#f5f7f5;--ink:#192824;--muted:#66746f;--line:#d9e1dc;--red:#a33128;--amber:#8c5c00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;font-size:16px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;padding:10px 15px;background:var(--green);color:#fff;font-weight:700}button.secondary{background:#e5ece8;color:var(--deep)}button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}button.danger{background:#a33128}.wrap{max-width:760px;margin:auto;min-height:100vh;background:white;box-shadow:0 0 30px #092c2610}.top{background:var(--deep);color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:2}.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:18px}.tag{font-size:12px;background:#ffffff20;padding:4px 8px;border-radius:30px}.notice{font-size:12px;color:#d5e8df;margin-top:5px}.main{padding:16px 16px 100px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wraprow{flex-wrap:wrap}.title{font-size:23px;margin:4px 0 14px}.sub{color:var(--muted);font-size:14px}.card{border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;background:white}.card h3{font-size:17px;margin:0 0 8px}.badge{display:inline-block;padding:3px 9px;border-radius:30px;background:#edf1ef;color:#42534c;font-size:12px;font-weight:700}.badge.bad{background:#ffebe8;color:var(--red)}.badge.warn{background:#fff4d9;color:var(--amber)}.badge.good{background:#e7f5eb;color:#25613a}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd6d0;border-radius:10px;padding:11px;background:white;color:var(--ink)}textarea{min-height:72px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.equip{border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;align-items:center;gap:9px;min-height:54px}.equip input{width:20px;height:20px;accent-color:var(--green)}.checkitem{padding:12px 0;border-bottom:1px solid var(--line)}.checkitem:last-child{border:0}.checktitle{font-weight:700;margin-bottom:9px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.choice{padding:8px 3px;min-height:42px;border-radius:9px;background:#eef2ef;color:#35433d;font-size:13px}.choice.active{background:var(--green);color:white}.choice[data-v="不備あり"].active{background:var(--red)}.choice[data-v="要確認"].active{background:#986500}.choice[data-v="未確認"].active{background:#596560}.small{font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:2}.bottom button{flex:1}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{text-align:center;padding:10px 3px;border-radius:12px;background:#f0f4f1}.stat b{display:block;font-size:20px}.warnbox{padding:11px;border-radius:12px;background:#fff4d9;color:#754e00;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:36px 12px}.photo{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px}.mutedline{height:1px;background:var(--line);margin:16px 0}.hidden{display:none!important}h2{font-size:19px;margin:23px 0 8px}.itemreason{margin-top:8px}.footnote{font-size:12px;color:var(--muted);margin:24px 0}.click{color:var(--green);text-decoration:underline;cursor:pointer}@media(max-width:390px){.grid{grid-template-columns:1fr}.choices{gap:4px}.choice{font-size:12px}.main{padding-left:13px;padding-right:13px}}
</style></head>
<body><div class="wrap"><header class="top"><div class="topline"><div class="brand">立入検査サポート</div><span class="tag">Ver.0.1 試作</span></div><div class="notice">操作確認用です。正式な点検票・法令判定ではありません。</div></header><main class="main" id="app"></main><nav id="nav" class="bottom hidden"></nav></div>
<script>
const TYPES=['消火器','屋内消火栓設備','自動火災報知設備','誘導灯・誘導標識','非常警報設備','火災通報装置'];
const CHECKS={
'消火器':['設置場所・標識','外形・損傷','安全栓・封印','圧力・指示表示'],
'屋内消火栓設備':['消火栓箱・表示','ホース・ノズル','バルブ・開閉状態','ポンプ・起動表示'],
'自動火災報知設備':['受信機・表示','感知器の外観','発信機・表示灯','音響・警報'],
'誘導灯・誘導標識':['設置場所・視認性','表示面・破損','点灯・表示状態','非常電源の表示'],
'非常警報設備':['起動装置・表示','音響・放送状態','表示・設置状態','電源表示'],
'火災通報装置':['装置・表示状態','通報先・登録表示','電源・予備電源表示','作動確認記録']};
const K='inspection-prototype-v1';let data=load(),page='home',id=null,equipIndex=0,ret='summary';
function load(){try{return JSON.parse(localStorage.getItem(K))||{inspections:[],people:[]}}catch{return{inspections:[],people:[]}}}
function save(){localStorage.setItem(K,JSON.stringify(data))}
function clean(){let n=Date.now();data.inspections=data.inspections.filter(x=>!x.completedAt||n-new Date(x.completedAt).getTime()<7*864e5);save()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return data.inspections.find(x=>x.id===id)}
function changed(msg){let x=current();if(!x)return;x.history.push({at:new Date().toISOString(),message:msg});save()}
function setPage(p){page=p;render()}
function beginNew(){let x={id:crypto.randomUUID(),name:'',kind:'立入検査',date:new Date().toISOString().slice(0,16),person:'',scope:'',building:'',address:'',memo:'',photo:'',equipments:[],completedAt:null,createdAt:new Date().toISOString(),history:[]};data.inspections.unshift(x);id=x.id;changed('検査を作成');setPage('info')}
function field(label,key,value='',type='text',placeholder=''){return `<div class="field"><label>${label}</label><input data-key="${key}" type="${type}" value="${esc(value)}" placeholder="${placeholder}" ${current()?.completedAt?'disabled':''}></div>`}
function snapField(key,val){let x=current();if(x&&x[key]!==val){x[key]=val;changed(`${key}を更新`)}}
function selectEquip(i){let x=current();if(x.completedAt)return;let t=TYPES[i];if(x.equipments.includes(t))x.equipments=x.equipments.filter(v=>v!==t);else{x.equipments.push(t);if(!x.results)x.results={};if(!x.results[t])x.results[t]=CHECKS[t].map(label=>({label,value:'未確認',reason:'',note:''}))}changed(`${t}を選択`);render()}
function verdict(){let vals=Object.values(current()?.results||{}).flat().map(a=>a.value);return {good:vals.filter(v=>v==='良好').length,bad:vals.filter(v=>v==='不備あり').length,review:vals.filter(v=>v==='要確認').length,unknown:vals.filter(v=>v==='未確認').length}}
function summaryCard(){let x=current(),v=verdict();return `<div class="statgrid"><div class="stat"><b>${v.good}</b><span class="small">良好</span></div><div class="stat"><b>${v.bad}</b><span class="small">不備</span></div><div class="stat"><b>${v.review}</b><span class="small">要確認</span></div><div class="stat"><b>${v.unknown}</b><span class="small">未確認</span></div></div>${v.unknown?`<div class="warnbox">未確認の項目が ${v.unknown} 件あります。確認できなかった項目を残したまま検査を終了できます。</div>`:''}<h2>検査情報</h2><div class="card">${[['予定名称',x.name],['検査種別',x.kind],['日時',x.date?.replace('T',' ')],['担当者',x.person],['検査範囲',x.scope],['対象物',x.building],['住所',x.address]].map(([a,b])=>`<div class="row"><span class="sub">${a}</span><b>${esc(b||'未入力')}</b></div>`).join('<div class="mutedline"></div>')}</div><h2>設備ごとの結果</h2>${x.equipments.map(t=>`<div class="card"><div class="row"><h3>${t}</h3>${!x.completedAt?`<button class="ghost" onclick="editEquip('${esc(t)}')">修正</button>`:''}</div>${(x.results[t]||[]).map(a=>`<div class="row"><span>${esc(a.label)}</span><span class="badge ${a.value==='不備あり'?'bad':a.value==='要確認'?'warn':a.value==='良好'?'good':''}">${a.value}</span></div>${a.reason?`<div class="small">不備理由: ${esc(a.reason)}</div>`:''}${a.note?`<div class="small">メモ: ${esc(a.note)}</div>`:''}`).join('')}${x.memo?`<p class="small">設備メモ: ${esc(x.memo)}</p>`:''}${x.photo?`<img class="photo" src="${x.photo}" alt="写真">`:''}</div>`).join('')||'<p class="sub">設備が選択されていません</p>'}<h2>変更履歴</h2><div class="card">${x.history.slice().reverse().map(h=>`<div class="small">${new Date(h.at).toLocaleString('ja-JP')} — ${esc(h.message)}</div>`).join('<div class="mutedline"></div>')||'記録なし'}</div>`}
function render(){clean();let app=document.getElementById('app'),nav=document.getElementById('nav');nav.classList.add('hidden');nav.innerHTML='';
if(page==='home'){app.innerHTML=`<div class="row"><h1 class="title">検査一覧</h1><button onclick="beginNew()">＋ 新しい検査</button></div><div class="warnbox">データはこのブラウザ内に保存されます。端末変更・ブラウザデータ消去で失われます。</div><div class="card"><h3>担当者リスト</h3><div class="row"><input id="personNew" placeholder="担当者名を追加" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px"><button onclick="addPerson()">追加</button></div><p class="small">${data.people.map(p=>`${esc(p)} <span class="click" onclick="removePerson('${esc(p)}')">削除</span>`).join('　')||'未登録'}</p></div>${data.inspections.map(x=>`<div class="card"><div class="row"><div><h3>${esc(x.name||'名称未設定')}</h3><div class="small">${esc(x.kind)} ・ ${esc((x.date||'').replace('T',' '))}</div><div class="small">${esc(x.person||'担当者未設定')}</div></div><span class="badge ${x.completedAt?'good':'warn'}">${x.completedAt?'完了':'進行中'}</span></div><div class="actions"><button class="secondary" onclick="openInspection('${x.id}')">${x.completedAt?'閲覧':'続きから'}</button><button class="ghost" onclick="deleteInspection('${x.id}')">削除</button></div></div>`).join('')||'<div class="empty">検査記録はまだありません。<br>「新しい検査」から始められます。</div>'}<p class="footnote">Ver.0.1の仮項目による操作確認用です。法定点検や消防署への提出に使用しないでください。完了記録は7日経過後、アプリを開いたときに削除されます。</p>`;return}
let x=current();if(!x){page='home';return render()}
if(page==='info'){app.innerHTML=`<h1 class="title">検査情報</h1><p class="sub">分かる範囲で入力してください。</p>${field('予定名称','name',x.name,'text','例：○○ビル 立入検査')}<div class="field"><label>検査種別</label><select data-key="kind" ${x.completedAt?'disabled':''}>${['立入検査','消防用設備等の点検','その他'].map(s=>`<option ${x.kind===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('検査日時','date',x.date,'datetime-local')}${field('担当者','person',x.person,'text','担当者名')}<p class="small">${data.people.map(p=>`<button class="ghost" onclick="document.querySelector('[data-key=person]').value='${esc(p)}';snapField('person','${esc(p)}')">${esc(p)}</button>`).join(' ')}</p>${field('検査範囲','scope',x.scope,'text','例：1階・共用部')} ${field('対象物名','building',x.building,'text','建物名')}${field('住所','address',x.address,'text','住所')}<div class="actions"><button class="secondary" onclick="setPage('home')">一覧へ</button><button onclick="setPage('equip')">設備を選ぶ →</button></div>`}
if(page==='equip'){app.innerHTML=`<h1 class="title">対象設備 ${x.completedAt?'<span class="badge good">閲覧のみ</span>':''}</h1><p class="sub">今回確認する設備を選択してください。設置要否の自動判定は行いません。</p><div class="grid">${TYPES.map((t,i)=>`<label class="equip"><input type="checkbox" ${x.equipments.includes(t)?'checked':''} ${x.completedAt?'disabled':''} onchange="selectEquip(${i})"><span>${t}</span></label>`).join('')}</div><div class="field"><label>全体メモ</label><textarea data-key="memo" ${x.completedAt?'disabled':''} placeholder="任意">${esc(x.memo)}</textarea></div><div class="field"><label>写真（任意）</label>${x.completedAt?'':`<input type="file" accept="image/*" capture="environment" id="photoIn">`}${x.photo?`<img class="photo" src="${x.photo}" alt="写真">`:''}<div class="small">写真は端末内に保存されます。</div></div><div class="actions"><button class="secondary" onclick="setPage('info')">← 検査情報</button><button onclick="startChecks()">点検項目へ →</button></div>`}
if(page==='checks'){let t=x.equipments[equipIndex];if(!t){page='equip';return render()}app.innerHTML=`<div class="row"><div><h1 class="title">${t}</h1><div class="sub">${equipIndex+1} / ${x.equipments.length} 設備${x.completedAt?' ・ 閲覧のみ':''}</div></div><button class="ghost" onclick="setPage('summary')">まとめ</button></div><div class="warnbox">下記は操作確認用の仮項目です。正式な点検項目ではありません。</div>${(x.results[t]||[]).map((a,i)=>`<div class="checkitem"><div class="checktitle">${esc(a.label)}</div><div class="choices">${['良好','不備あり','要確認','未確認'].map(v=>`<button class="choice ${a.value===v?'active':''}" data-v="${v}" ${x.completedAt?'disabled':''} onclick="setVerdict('${esc(t)}',${i},'${v}')">${v}</button>`).join('')}</div>${a.value==='不備あり'?`<div class="field itemreason"><label>不備理由</label><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)" placeholder="確認内容を入力">${esc(a.reason)}</textarea></div>`:''}<div class="field"><label>メモ（任意）</label><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'note',this.value)" placeholder="補足">${esc(a.note)}</textarea></div></div>`).join('')}<div class="actions"><button class="secondary" onclick="equipIndex=Math.max(0,equipIndex-1);render()">← 前の設備</button><button onclick="nextEquip()">${equipIndex<x.equipments.length-1?'次の設備 →':'まとめを確認 →'}</button></div>`}
if(page==='summary'){app.innerHTML=`<div class="row"><h1 class="title">検査まとめ</h1><span class="badge ${x.completedAt?'good':'warn'}">${x.completedAt?'完了（閲覧のみ）':'完了前'}</span></div>${summaryCard()}${!x.completedAt?`<div class="actions"><button class="secondary" onclick="setPage('equip')">設備・メモを修正</button><button onclick="finish()">検査完了</button></div><p class="small">「検査完了」後は編集できません。7日間の閲覧後、次回起動時に自動削除されます。</p>`:`<div class="actions"><button class="secondary" onclick="setPage('home')">一覧へ戻る</button></div>`}`}
if(page==='editEquip'){let t=ret;app.innerHTML=`<h1 class="title">${t} を修正</h1>${(x.results[t]||[]).map((a,i)=>`<div class="checkitem"><div class="checktitle">${esc(a.label)} <span class="badge">${a.value}</span></div>${a.reason?`<p class="small">${esc(a.reason)}</p>`:''}${a.note?`<p class="small">${esc(a.note)}</p>`:''}<button class="ghost" onclick="equipIndex=${x.equipments.indexOf(t)};setPage('checks')">内容を修正</button></div>`).join('')}<div class="actions"><button onclick="setPage('summary')">まとめへ戻る</button></div>`}
if(page!=='editEquip'){nav.classList.remove('hidden');nav.innerHTML=`<button class="secondary" onclick="setPage('info')">情報</button><button class="secondary" onclick="setPage('equip')">設備選択</button><button onclick="setPage('summary')">まとめ</button>`}
document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('change',()=>snapField(el.dataset.key,el.value));if(el.tagName==='TEXTAREA')el.addEventListener('input',()=>snapField(el.dataset.key,el.value))});let fi=document.getElementById('photoIn');if(fi)fi.onchange=()=>{let f=fi.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/im.width);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);x.photo=c.toDataURL('image/jpeg',.72);changed('写真を追加');render()};im.src=r.result};r.readAsDataURL(f)};
}
function addPerson(){let v=document.getElementById('personNew').value.trim();if(v&&!data.people.includes(v)){data.people.push(v);save();render()}}
function removePerson(p){data.people=data.people.filter(x=>x!==p);save();render()}
function openInspection(i){id=i;setPage(current().completedAt?'summary':'info')}
function deleteInspection(i){if(confirm('この検査記録を削除しますか？')){data.inspections=data.inspections.filter(x=>x.id!==i);save();render()}}
function startChecks(){if(!current().equipments.length){alert('対象設備を1つ以上選択してください');return}equipIndex=0;setPage('checks')}
function setVerdict(t,i,v){let x=current();if(x.completedAt)return;x.results[t][i].value=v;changed(`${t}「${x.results[t][i].label}」を${v}に変更`);render()}
function setItemText(t,i,k,v){let x=current();if(x.completedAt)return;x.results[t][i][k]=v;changed(`${t}「${x.results[t][i].label}」の記述を更新`)}
function nextEquip(){if(equipIndex<x.equipments.length-1){equipIndex++;render()}else setPage('summary')}
function editEquip(t){ret=t;setPage('editEquip')}
function finish(){let x=current();if(!confirm('検査を完了しますか？完了後は編集できません。'))return;x.completedAt=new Date().toISOString();changed('検査を完了（以降閲覧のみ）');setPage('summary')}
clean();render();
</script></body></html>
