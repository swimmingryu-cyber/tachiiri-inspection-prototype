<body><div class="wrap"><header class="top"><div class="topline"><div class="brand">立入検査サポート</div><span class="tag">Ver.0.1 試作</span></div><div class="notice">操作確認用です。正式な点検票・法令判定ではありません。</div></header><main class="main" id="app"></main><nav id="nav" class="bottom hidden"></nav></div>
<script>
const TYPES=['消火器','屋内消火栓設備','自動火災報知設備','誘導灯・誘導標識','非常警報設備','火災通報装置'];
const FIRE_USES=[['1イ','劇場・映画館など'],['1ロ','公会堂・集会場'],['2イ','キャバレーなど'],['2ロ','遊技場・ダンスホールなど'],['2ハ','性風俗関連店舗など'],['2ニ','カラオケボックスなど'],['3イ','料理店など'],['3ロ','飲食店'],['4','百貨店・物品販売店'],['5イ','旅館・ホテル'],['5ロ','共同住宅・寄宿舎'],['6イ1','病院など'],['6イ2','診療所など'],['6イ3','助産所など'],['6イ4','病院・診療所のうち上記以外'],['6ロ','自力避難困難者の入所施設など'],['6ハ','福祉施設など'],['6ニ','幼稚園・特別支援学校など'],['7','学校'],['8','図書館・博物館など'],['9イ','蒸気浴場など'],['9ロ','公衆浴場など'],['10','駅舎・空港など'],['11','神社・寺院など'],['12','工場・作業場'],['13イ','映画スタジオなど'],['13ロ','テレビスタジオなど'],['14','倉庫'],['15','事務所など'],['16イ','複合用途（特定用途を含む）'],['16ロ','複合用途（特定用途を含まない）'],['16の2','地下街'],['16の3','準地下街'],['17','重要文化財など'],['18','アーケード'],['19','山林'],['20','船舶・車両']];
const CHECKS={
'消火器':['設置場所・標識','外形・損傷','安全栓・封印','圧力・指示表示'],
'屋内消火栓設備':['消火栓箱・表示','ホース・ノズル','バルブ・開閉状態','ポンプ・起動表示'],
'自動火災報知設備':['受信機・表示','感知器の外観','発信機・表示灯','音響・警報'],
'誘導灯・誘導標識':['設置場所・視認性','表示面・破損','点灯・表示状態','非常電源の表示'],
'非常警報設備':['起動装置・表示','音響・放送状態','表示・設置状態','電源表示'],
'火災通報装置':['装置・表示状態','通報先・登録表示','電源・予備電源表示','作動確認記録']};
const GUIDANCE={
'消火器':{article:'消防法施行令 第10条',common:['消火器の未設置・配置不足','標識がない・見えにくい','本体の腐食・変形・損傷','安全栓・封印の異常','圧力計の指示が適正範囲外'],url:'https://laws.e-gov.go.jp/law/336CO0000000037#Mp-At_10',guide:'https://www.fdma.go.jp/mission/prevention/post-1.html'},
'屋内消火栓設備':{article:'消防法施行令 第11条',common:['消火栓箱・表示の損傷や不備','ホース・ノズルの損傷・欠品','バルブの開閉不良・漏水','ポンプ・起動表示の異常','操作方法の表示がない'],url:'https://laws.e-gov.go.jp/law/336CO0000000037#Mp-At_11',guide:'https://www.fdma.go.jp/mission/prevention/post-1.html'},
'自動火災報知設備':{article:'消防法施行令 第21条',common:['受信機の異常表示・故障表示','感知器の破損・脱落・汚損','発信機・表示灯の破損・表示不良','音響装置が鳴らない・聞こえにくい','未警戒区域がある'],url:'https://laws.e-gov.go.jp/law/336CO0000000037#Mp-At_21',guide:'https://www.fdma.go.jp/mission/prevention/post-1.html'},
'誘導灯・誘導標識':{article:'消防法施行令 第26条',common:['避難口・通路の誘導表示がない','表示が見えにくい・破損している','誘導灯が点灯しない','非常電源の異常','避難方向の表示が不適切'],url:'https://laws.e-gov.go.jp/law/336CO0000000037#Mp-At_26',guide:'https://www.fdma.go.jp/mission/prevention/post-1.html'},
'非常警報設備':{article:'消防法施行令 第24条',common:['起動装置がない・操作しにくい','音響・放送が作動しない','全区域に警報が届かない','表示・設置状態の不備','非常電源の異常'],url:'https://laws.e-gov.go.jp/law/336CO0000000037#Mp-At_24',guide:'https://www.fdma.go.jp/mission/prevention/post-1.html'},
'火災通報装置':{article:'消防法施行令 第23条',common:['装置の故障・表示異常','通報先・登録内容の不備','通報回線が使用できない','電源・予備電源の異常','試験・点検記録が確認できない'],url:'https://laws.e-gov.go.jp/law/336CO0000000037#Mp-At_23',guide:'https://www.fdma.go.jp/mission/prevention/post-1.html'}};
const MANAGEMENT={
'消火器':'設置場所を見やすく、すぐ取り出せる状態に保ち、通行・避難を妨げないこと。適応火災表示と維持管理状況も確認します。',
'屋内消火栓設備':'消火栓箱の前を塞がず、ホース・ノズル・バルブ・ポンプ・水源・電源が使用可能な状態で維持されているか確認します。',
'自動火災報知設備':'受信機、感知器、発信機、警報装置が必要な範囲で機能し、回路・電源・表示に異常がない状態を維持します。',
'誘導灯・誘導標識':'避難口や避難経路で視認でき、物品等で隠れず、誘導方向が適切で、誘導灯の非常電源が機能する状態を維持します。',
'非常警報設備':'起動装置を操作しやすい状態に保ち、必要な区域に警報が届き、非常電源を含め作動できる状態を維持します。',
'火災通報装置':'消防機関への通報に必要な回線・登録情報・電源が使用可能な状態で維持され、試験・点検の記録が確認できるようにします。'};
function estimatePanel(x){return `<h2>消防用設備の全国基準目安</h2><div class="warnbox">簡易目安です。候補は設置義務の確定ではなく、「条件確認」は不要の判定ではありません。複合用途、階ごとの面積、構造・内装、無窓階、例外、地域条例は別途確認してください。</div><div class="card">${estimateEquipment(x).map(r=>`<div class="row"><b>${r.name}</b><span class="badge ${r.hit?'warn':''}">${r.hit?'候補':'条件確認'}</span></div><div class="small">${esc(r.hit||r.note)}</div><div class="mutedline"></div>`).join('')}<a href="https://laws.e-gov.go.jp/law/336CO0000000037" target="_blank" rel="noopener">消防法施行令（e-Gov）</a><div class="actions"><button class="secondary" onclick="applySuggestedEquipment()">候補設備を選択に反映</button></div></div>`}
function estimateEquipment(x){let c=x.useCategory||'',a=Number(x.totalArea)||0,above=Number(x.floorsAbove)||0,below=Number(x.floorsBelow)||0,people=Number(x.occupants)||0,all=['消火器','屋内消火栓設備','自動火災報知設備','誘導灯・誘導標識','非常警報設備','火災通報装置'],hits={};function hit(n,r){hits[n]=r}let c1=c.startsWith('1'),c2=c.startsWith('2'),c3=c.startsWith('3'),c6=c.startsWith('6'),c9=c.startsWith('9'),c13=c.startsWith('13'),c16=c.startsWith('16');
if(['1イ','2イ','2ロ','2ハ','2ニ','6イ1','6イ2','6イ3','6ロ','16の2','16の3','17','20'].includes(c))hit('消火器','令第10条の用途区分に該当する可能性');else if(a>=150&&(['1ロ','4','5イ','5ロ','6イ4','6ハ','6ニ','9イ','9ロ','12','13イ','13ロ','14'].includes(c)))hit('消火器','令第10条の延べ面積基準（150㎡以上）に該当する可能性');
if((c==='3イ'||c==='3ロ')&&x.cookingFire==='はい')hit('消火器','令第10条の火気使用設備に関する条件に該当する可能性');let hydrantThreshold=c1?500:(c2||c3||c6||['4','5イ','5ロ','7','8','9イ','9ロ','10','12','14'].includes(c)?700:(['11','15'].includes(c)?1000:(c==='16の2'?150:null)));if(hydrantThreshold&&a>=hydrantThreshold)hit('屋内消火栓設備',`令第11条の基本面積基準（延べ面積${hydrantThreshold}㎡以上）に該当する可能性`);
if(['2ニ','5イ','6イ1','6イ2','6イ3','6ロ','13ロ','17'].includes(c))hit('自動火災報知設備','令第21条の用途区分に該当する可能性');else if(c==='9イ'&&a>=200)hit('自動火災報知設備','令第21条の面積基準（200㎡以上）に該当する可能性');else if((c1||['2イ','2ロ','2ハ','3イ','3ロ','4','6イ4','6ニ','16イ','16の2'].includes(c))&&a>=300)hit('自動火災報知設備','令第21条の面積基準（300㎡以上）に該当する可能性');else if(['5ロ','7','8','9ロ','10','12','13イ','14'].includes(c)&&a>=500)hit('自動火災報知設備','令第21条の面積基準（500㎡以上）に該当する可能性');else if(['11','15'].includes(c)&&a>=1000)hit('自動火災報知設備','令第21条の面積基準（1,000㎡以上）に該当する可能性');
if(c1||c2||c3||c==='4'||c==='5イ'||c6||c9||c==='16イ'||c==='16の2'||c==='16の3')hit('誘導灯・誘導標識','令第26条の用途区分に該当する可能性');else if(above>=11||below>=1)hit('誘導灯・誘導標識','地階・無窓階・11階以上の部分などの確認が必要');
if(c==='16の2'||c==='16の3'||above>=11||below>=3)hit('非常警報設備','令第24条の階数・用途区分に該当する可能性');else if(c==='16イ'&&people>=500)hit('非常警報設備','令第24条の収容人員基準（500人以上）に該当する可能性');else if((c1||c2||c3||c==='4'||c==='5イ'||c6||c==='9イ')&&people>=300)hit('非常警報設備','令第24条の収容人員基準（300人以上）に該当する可能性');else if((c==='5ロ'||c==='7'||c==='8')&&people>=800)hit('非常警報設備','令第24条の収容人員基準（800人以上）に該当する可能性');else if((c==='5イ'||c==='6イ1'||c==='6イ2'||c==='6イ3'||c==='9イ')&&people>=20)hit('非常警報設備','令第24条の収容人員基準（20人以上）に該当する可能性');else if(people>=50)hit('非常警報設備','令第24条の収容人員基準に該当する可能性');
if(['6イ1','6イ2','6イ3','6ロ','16の2','16の3'].includes(c))hit('火災通報装置','令第23条の用途区分に該当する可能性');else if((c1||c2||c==='4'||c==='5イ'||c==='6イ4'||c==='6ハ'||c==='6ニ'||c==='12'||c==='17')&&a>=500)hit('火災通報装置','令第23条の面積基準（500㎡以上）に該当する可能性');else if((c3||c==='5ロ'||c==='7'||c==='8'||c==='9イ'||c==='9ロ'||c==='10'||c==='11'||c==='13イ'||c==='13ロ'||c==='14'||c==='15')&&a>=1000)hit('火災通報装置','令第23条の面積基準（1,000㎡以上）に該当する可能性');
return all.map(name=>({name,hit:hits[name]||'',note:!c||!a?'用途区分と延べ面積を入力してください。':((c==='3イ'||c==='3ロ')&&x.cookingFire!=='はい'?'飲食店等では火を使用する設備・器具の有無を確認してください。':(c16||x.mixedUse==='はい'?'複合用途の各用途部分の床面積・区画条件を別途確認してください。':((above>=4||below>0)?'階ごとの床面積、無窓階、構造・内装制限等の条件も別途確認してください。':'この簡易条件で該当を確認できない場合も、設置不要を意味しません。')))}));}
const K='inspection-prototype-v1';let data=load(),page='home',id=null,equipIndex=0,ret='summary';
function load(){try{return JSON.parse(localStorage.getItem(K))||{inspections:[],people:[]}}catch{return{inspections:[],people:[]}}}
function save(){localStorage.setItem(K,JSON.stringify(data))}
function clean(){let n=Date.now();data.inspections=data.inspections.filter(x=>!x.completedAt||n-new Date(x.completedAt).getTime()<7*864e5);save()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return data.inspections.find(x=>x.id===id)}
function changed(msg){let x=current();if(!x)return;x.history.push({at:new Date().toISOString(),message:msg});save()}
function setPage(p){page=p;render()}
function beginNew(){let x={id:crypto.randomUUID(),name:'',kind:'立入検査',date:new Date().toISOString().slice(0,16),person:'',scope:'',building:'',address:'',floorsAbove:'',floorsBelow:'',totalArea:'',occupants:'',useCategory:'',structure:'',cookingFire:'',mixedUse:'',memo:'',photo:'',equipments:[],completedAt:null,createdAt:new Date().toISOString(),history:[]};data.inspections.unshift(x);id=x.id;changed('検査を作成');setPage('info')}
function field(label,key,value='',type='text',placeholder=''){return `<div class="field"><label>${label}</label><input data-key="${key}" type="${type}" value="${esc(value)}" placeholder="${placeholder}" ${current()?.completedAt?'disabled':''}></div>`}
function snapField(key,val){let x=current();if(x&&x[key]!==val){x[key]=val;changed(`${key}を更新`)}}
function selectEquip(i){let x=current();if(x.completedAt)return;let t=TYPES[i];if(x.equipments.includes(t))x.equipments=x.equipments.filter(v=>v!==t);else{x.equipments.push(t);if(!x.results)x.results={};if(!x.results[t])x.results[t]=CHECKS[t].map(label=>({label,value:'未確認',reason:'',note:''}))}changed(`${t}を選択`);render()}
function verdict(){let vals=Object.values(current()?.results||{}).flat().map(a=>a.value);return {good:vals.filter(v=>v==='良好').length,bad:vals.filter(v=>v==='不備あり').length,review:vals.filter(v=>v==='要確認').length,na:vals.filter(v=>v==='該当なし').length,unknown:vals.filter(v=>v==='未確認').length}}function summaryCard(){let x=current(),v=verdict();return `<div class="statgrid"><div class="stat"><b>${v.good}</b><span class="small">良好</span></div><div class="stat"><b>${v.bad}</b><span class="small">不備</span></div><div class="stat"><b>${v.review}</b><span class="small">要確認</span></div><div class="stat"><b>${v.na}</b><span class="small">該当なし</span></div><div class="stat"><b>${v.unknown}</b><span class="small">未確認</span></div></div>${v.unknown?`<div class="warnbox">未確認の項目が ${v.unknown} 件あります。確認できなかった項目を残したまま検査を終了できます。</div>`:''}<h2>検査情報</h2><div class="card">${[['予定名称',x.name],['検査種別',x.kind],['日時',x.date?.replace('T',' ')],['担当者',x.person],['検査範囲',x.scope],['対象物',x.building],['住所',x.address],['地上階数',x.floorsAbove],['地下階数',x.floorsBelow],['延べ面積（㎡）',x.totalArea],['用途区分',x.useCategory],['収容人員',x.occupants],['複合用途',x.mixedUse],['火気設備',x.cookingFire],['構造',x.structure]].map(([a,b])=>`<div class="row"><span class="sub">${a}</span><b>${esc(b||'未入力')}</b></div>`).join('<div class="mutedline"></div>')}</div><h2>設備ごとの結果</h2>${estimatePanel(x)}${x.equipments.map(t=>`<div class="card"><div class="row"><h3>${t}</h3>${!x.completedAt?`<button class="ghost" onclick="editEquip('${esc(t)}')">修正</button>`:''}</div><p class="small">${GUIDANCE[t].article} · <a href="${GUIDANCE[t].url}" target="_blank" rel="noopener">e-Gov法令</a> · <a href="${GUIDANCE[t].guide}" target="_blank" rel="noopener">消防庁点検要領</a></p>${(x.results[t]||[]).map(a=>`<div class="row"><span>${esc(a.label)}</span><span class="badge ${a.value==='不備あり'?'bad':a.value==='要確認'?'warn':a.value==='良好'?'good':''}">${a.value}</span></div>${a.reason?`<div class="small">不備理由: ${esc(a.reason)}</div>`:''}${a.note?`<div class="small">メモ: ${esc(a.note)}</div>`:''}`).join('')}${x.memo?`<p class="small">設備メモ: ${esc(x.memo)}</p>`:''}${x.photo?`<img class="photo" src="${x.photo}" alt="写真">`:''}</div>`).join('')||'<p class="sub">設備が選択されていません</p>'}<details class="card"><summary>変更履歴（${x.history.length}件）</summary><div style="margin-top:10px">${x.history.slice().reverse().map(h=>`<div class="small">${new Date(h.at).toLocaleString('ja-JP')} — ${esc(h.message)}</div>`).join('<div class="mutedline"></div>')||'記録なし'}</div></details>`}function render(){clean();let app=document.getElementById('app'),nav=document.getElementById('nav');nav.classList.add('hidden');nav.innerHTML='';
if(page==='home'){app.innerHTML=`<div class="row"><h1 class="title">検査一覧</h1><button onclick="beginNew()">＋ 新しい検査</button></div><div class="warnbox">データはこのブラウザ内に保存されます。端末変更・ブラウザデータ消去で失われます。</div><div class="card"><h3>担当者リスト</h3><div class="row"><input id="personNew" placeholder="担当者名を追加" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px"><button onclick="addPerson()">追加</button></div><p class="small">${data.people.map(p=>`${esc(p)} <span class="click" onclick="removePerson('${esc(p)}')">削除</span>`).join('　')||'未登録'}</p></div>${data.inspections.map(x=>`<div class="card"><div class="row"><div><h3>${esc(x.name||'名称未設定')}</h3><div class="small">${esc(x.kind)} ・ ${esc((x.date||'').replace('T',' '))}</div><div class="small">${esc(x.person||'担当者未設定')}</div></div><span class="badge ${x.completedAt?'good':'warn'}">${x.completedAt?'完了':'進行中'}</span></div><div class="actions"><button class="secondary" onclick="openInspection('${x.id}')">${x.completedAt?'閲覧':'続きから'}</button><button class="ghost" onclick="deleteInspection('${x.id}')">削除</button></div></div>`).join('')||'<div class="empty">検査記録はまだありません。<br>「新しい検査」から始められます。</div>'}<p class="footnote">Ver.0.1の仮項目による操作確認用です。法定点検や消防署への提出に使用しないでください。完了記録は7日経過後、アプリを開いたときに削除されます。</p>`;return}
let x=current();if(!x){page='home';return render()}
if(page==='info'){app.innerHTML=`<h1 class="title">検査情報</h1><p class="sub">分かる範囲で入力してください。</p>${field('予定名称','name',x.name,'text','例：○○ビル 立入検査')}<div class="field"><label>検査種別</label><select data-key="kind" ${x.completedAt?'disabled':''}>${['立入検査','消防用設備等の点検','その他'].map(s=>`<option ${x.kind===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('検査日時','date',x.date,'datetime-local')}${field('担当者','person',x.person,'text','担当者名')}<p class="small">${data.people.map(p=>`<button class="ghost" onclick="document.querySelector('[data-key=person]').value='${esc(p)}';snapField('person','${esc(p)}')">${esc(p)}</button>`).join(' ')}</p>${field('検査範囲','scope',x.scope,'text','例：1階・共用部')} ${field('対象物名','building',x.building,'text','建物名')}${field('住所','address',x.address,'text','住所')}<h2>建物情報（全国基準の目安用）</h2>${field('地上階数','floorsAbove',x.floorsAbove,'number','例：5')}${field('地下階数','floorsBelow',x.floorsBelow,'number','例：1')}${field('延べ面積（㎡）','totalArea',x.totalArea,'number','例：1200')}<div class="field"><label>主な用途区分（消防法施行令 別表第一）</label><select data-key="useCategory" ${x.completedAt?'disabled':''}><option value="">選択してください</option>${FIRE_USES.map(([c,n])=>`<option value="${c}" ${x.useCategory===c?'selected':''}>${c}　${n}</option>`).join('')}</select><div class="small">複合用途やテナントごとに用途が異なる場合は、現時点では「要確認」扱いです。</div></div>${field('収容人員（人）','occupants',x.occupants,'number','例：80')}<div class="field"><label>複合用途（複数の用途）</label><select data-key="mixedUse" ${x.completedAt?'disabled':''}><option value="" ${!x.mixedUse?'selected':''}>不明</option>${['はい','いいえ'].map(s=>`<option ${x.mixedUse===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>火を使用する設備・器具（飲食店等）</label><select data-key="cookingFire" ${x.completedAt?'disabled':''}><option value="" ${!x.cookingFire?'selected':''}>不明</option>${['はい','いいえ'].map(s=>`<option ${x.cookingFire===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>構造（分かる場合）</label><select data-key="structure" ${x.completedAt?'disabled':''}><option value="" ${!x.structure?'selected':''}>不明</option>${['耐火','準耐火','その他'].map(s=>`<option ${x.structure===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="actions"><button class="secondary" onclick="setPage('home')">一覧へ</button><button onclick="setPage('equip')">設備を選ぶ →</button></div>`}
if(page==='equip'){app.innerHTML=`<h1 class="title">対象設備 ${x.completedAt?'<span class="badge good">閲覧のみ</span>':''}</h1><p class="sub">今回確認する設備を選択してください。全国基準の簡易目安を下に表示します。</p>${estimatePanel(x)}<div class="grid">${TYPES.map((t,i)=>`<label class="equip"><input type="checkbox" ${x.equipments.includes(t)?'checked':''} ${x.completedAt?'disabled':''} onchange="selectEquip(${i})"><span>${t}</span></label>`).join('')}</div><div class="field"><label>全体メモ</label><textarea data-key="memo" ${x.completedAt?'disabled':''} placeholder="任意">${esc(x.memo)}</textarea></div><div class="field"><label>写真（任意）</label>${x.completedAt?'':`<input type="file" accept="image/*" capture="environment" id="photoIn">`}${x.photo?`<img class="photo" src="${x.photo}" alt="写真">`:''}<div class="small">写真は端末内に保存されます。</div></div><div class="actions"><button class="secondary" onclick="setPage('info')">← 検査情報</button><button onclick="startChecks()">点検項目へ →</button></div>`}
if(page==='checks'){let t=x.equipments[equipIndex];if(!t){page='equip';return render()}app.innerHTML=`<div class="row"><div><h1 class="title">${t}</h1><div class="sub">${equipIndex+1} / ${x.equipments.length} 設備${x.completedAt?' ・ 閲覧のみ':''}</div></div><button class="ghost" onclick="setPage('summary')">まとめを確認</button></div><div class="warnbox">操作確認用の仮項目です。正式な点検項目ではありません。</div><details class="card"><summary>確認ポイント・管理ポイント・法的根拠</summary><p><b>確認ポイント</b></p><ul>${CHECKS[t].map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p><b>管理ポイント</b></p><p>${MANAGEMENT[t]} 具体的な適用条件や例外は、用途・構造・規模等を含めて法令と所轄消防本部の基準で確認してください。</p><p><a href="${GUIDANCE[t].url}" target="_blank" rel="noopener">${GUIDANCE[t].article}（e-Gov）</a><br><a href="${GUIDANCE[t].guide}" target="_blank" rel="noopener">消防庁 点検基準・点検要領・点検票</a></p><p><b>よくある不備</b></p><ul>${GUIDANCE[t].common.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></details>${(x.results[t]||[]).map((a,i)=>`<div class="checkitem"><div class="checktitle">${esc(a.label)}</div><div class="choices">${['良好','不備あり','要確認','該当なし','未確認'].map(v=>`<button class="choice ${a.value===v?'active':''}" data-v="${v}" ${x.completedAt?'disabled':''} onclick="setVerdict('${esc(t)}',${i},'${v}')">${v}</button>`).join('')}</div>${a.value==='不備あり'?`<div class="field itemreason"><label>不備理由（候補選択または自由入力・必須）</label><select ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)"><option value="">理由を選択してください</option>${GUIDANCE[t].common.map(v=>`<option value="${esc(v)}" ${a.reason===v?'selected':''}>${esc(v)}</option>`).join('')}<option value="その他" ${a.reason==='その他'?'selected':''}>その他</option></select><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)" placeholder="その他の理由・補足">${esc(a.reason)}</textarea></div>`:''}${a.value==='要確認'?`<div class="field"><label>確認理由（任意）</label><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)" placeholder="確認が必要な理由">${esc(a.reason)}</textarea></div>`:''}<div class="field"><label>メモ（任意）</label><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'note',this.value)" placeholder="補足">${esc(a.note)}</textarea></div></div>`).join('')}<div class="actions"><button class="secondary" onclick="equipIndex=Math.max(0,equipIndex-1);render()">← 前の設備</button><button onclick="nextEquip()">${equipIndex<x.equipments.length-1?'次の設備 →':'まとめを確認 →'}</button></div>`}if(page==='summary'){app.innerHTML=`<div class="row"><h1 class="title">検査まとめ</h1><span class="badge ${x.completedAt?'good':'warn'}">${x.completedAt?'完了（閲覧のみ）':'完了前'}</span></div>${summaryCard()}${!x.completedAt?`<div class="actions"><button class="secondary" onclick="setPage('equip')">設備・メモを修正</button><button onclick="finish()">検査完了</button></div><p class="small">「検査完了」後は編集できません。7日間の閲覧後、次回起動時に自動削除されます。</p>`:`<div class="actions"><button class="secondary" onclick="setPage('home')">一覧へ戻る</button></div>`}`}
if(page==='editEquip'){let t=ret;app.innerHTML=`<h1 class="title">${t} を修正</h1>${(x.results[t]||[]).map((a,i)=>`<div class="checkitem"><div class="checktitle">${esc(a.label)} <span class="badge">${a.value}</span></div>${a.reason?`<p class="small">${esc(a.reason)}</p>`:''}${a.note?`<p class="small">${esc(a.note)}</p>`:''}<button class="ghost" onclick="equipIndex=${x.equipments.indexOf(t)};setPage('checks')">内容を修正</button></div>`).join('')}<div class="actions"><button onclick="setPage('summary')">まとめへ戻る</button></div>`}
if(page!=='editEquip'){nav.classList.remove('hidden');nav.innerHTML=`<button class="secondary" onclick="setPage('info')">情報</button><button class="secondary" onclick="setPage('equip')">設備選択</button><button onclick="setPage('summary')">まとめ</button>`}
document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('change',()=>snapField(el.dataset.key,el.value));if(el.tagName==='TEXTAREA')el.addEventListener('input',()=>snapField(el.dataset.key,el.value))});let fi=document.getElementById('photoIn');if(fi)fi.onchange=()=>{let f=fi.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/im.width);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);x.photo=c.toDataURL('image/jpeg',.72);changed('写真を追加');render()};im.src=r.result};r.readAsDataURL(f)};
}
function addPerson(){let v=document.getElementById('personNew').value.trim();if(v&&!data.people.includes(v)){data.people.push(v);save();render()}}
function removePerson(p){data.people=data.people.filter(x=>x!==p);save();render()}
function openInspection(i){id=i;setPage(current().completedAt?'summary':'info')}
function deleteInspection(i){if(confirm('この検査記録を削除しますか？')){data.inspections=data.inspections.filter(x=>x.id!==i);save();render()}}
function applySuggestedEquipment(){let x=current();if(!x||x.completedAt)return;let added=[];x.equipments=x.equipments||[];x.results=x.results||{};for(let r of estimateEquipment(x).filter(r=>r.hit)){if(!x.equipments.includes(r.name)){x.equipments.push(r.name);added.push(r.name)}if(!x.results[r.name])x.results[r.name]=CHECKS[r.name].map(label=>({label,value:'未確認',reason:'',note:''}))}if(added.length)changed('全国基準目安の候補を追加: '+added.join('、'));else save();render()}
function startChecks(){if(!current().equipments.length){alert('対象設備を1つ以上選択してください');return}equipIndex=0;setPage('checks')}
function setVerdict(t,i,v){let x=current();if(x.completedAt)return;x.results[t][i].value=v;changed(`${t}「${x.results[t][i].label}」を${v}に変更`);render()}
function setItemText(t,i,k,v){let x=current();if(x.completedAt)return;x.results[t][i][k]=v;changed(`${t}「${x.results[t][i].label}」の記述を更新`)}
function nextEquip(){let x=current();if(!x||!x.equipments.length){setPage('equip');return}if(equipIndex<x.equipments.length-1){equipIndex++;render()}else setPage('summary')}
function editEquip(t){ret=t;setPage('editEquip')}
function finish(){let x=current();let missing=Object.values(x.results||{}).flat().filter(a=>a.value==='不備あり'&&(!String(a.reason||'').trim()||String(a.reason).trim()==='その他'));if(missing.length){alert('不備理由が未入力の項目が '+missing.length+' 件あります。理由を入力してください。');return}if(!confirm('検査を完了しますか？完了後は編集できません。'))return;x.completedAt=new Date().toISOString();changed('検査を完了（以降閲覧のみ）');setPage('summary')}
clean();render();
</script></body></html>
