<script>
const EVACUATION = '避難経路・開口部';
const EVACUATION_CHECKS = [
  ['廊下・通路の有効幅', '棚・台車・商品などがある状態で、最も狭い箇所の通行幅を確認します。'],
  ['階段・踊り場', '荷物などが通行を妨げていないか確認します。'],
  ['避難口の開放・通行', '扉の前後に物品がなく、開放して通り抜けられるか確認します。'],
  ['避難口の先の屋外通路', '資材・自転車などが屋外への通行を妨げていないか確認します。'],
  ['誘導灯・誘導標識の見え方', '避難する方向から見て、棚や掲示物に隠れていないか確認します。'],
  ['防火戸の閉鎖範囲', '扉の開閉範囲に物品やくさびがないか確認します。'],
  ['防火シャッターの降下範囲', 'シャッターの真下や降下範囲に棚・荷物がないか確認します。'],
  ['有効開口部への室内側からの接近', '台帳等の有効開口部まで、棚や間仕切りなどに妨げられず近づけるか確認します。'],
  ['有効開口部の開放・使える範囲', '窓の開放や有効な開口範囲に、棚・荷物・閉鎖物などの支障がないか確認します。'],
  ['有効開口部への屋外側からの接近・進入', '資材・看板・囲いなどが屋外側からの接近や進入を妨げていないか確認します。']
];
const ORDINANCE_PREVIEW = '条例対象設備';
const ORDINANCE_TYPES = {
  transformer: {
    title:'変電設備・キュービクル', article:'第15条', keywords:'受変電設備 高圧受電',
    common:[
      ['標識・立入管理','設備の表示と係員以外の立入防止を確認。'],
      ['可燃物・整理状況','油ぼろや段ボールなどが周囲に放置されていないか確認。'],
      ['点検・補修記録','点検・測定試験の結果を確認し、不良の指摘があれば補修の実施と記録まで確認。'],
      ...['前面','左側面','右側面','背面'].map(face=>[`各面の保有距離（${face}）`,'キュービクルの面の用途、実測値、支障物を記録。操作・点検・換気の兼用面はメモへ。', 'face', '非常電源専用受電設備の点検要領の例は、操作面100cm、点検面60cm、換気面20cm。設備に適用する基準は所轄の審査基準・届出図面等で確認。'])
    ],
    indoor:[['屋内の区画・貫通部','区画が必要な設備では、後から通したケーブル・ダクト周囲の隙間や不燃材等による処理を確認。','', '条例第15条第1項第3号・第3号の3。見えない部分は図面等で照合。'],['屋外への換気','屋外へ通じる給排気口に、物品等による閉塞がないか確認。']],
    outdoor:[['建築物との離隔','第15条第2項の対象となる屋外設備は原則3m以上。認められた構造のキュービクル式などの除外や、開口部のない不燃外壁に面する場合の例外を確認。'],['面する外壁・開口部','外壁の材質、窓・扉などの開口部の有無を記録。'],['除外・例外の確認資料','キュービクルの構造や認定等の資料、外壁条件を確認。条件が不明なら要確認。']]
  },
  kitchen: {
    title:'厨房設備・レンジ・フライヤー', article:'第5条の2', keywords:'かまど コンロ ガスレンジ 厨房 調理',
    common:[
      ['周囲の可燃物・離隔','設備の種類と、壁・棚・可燃物との位置関係を確認。熱源・機器の種類、壁の仕上げ、上方・側方・後方を確認し、条例別表第3または機器に適用される離隔距離と照合。'],
      ['排気ダクト・天蓋','材質、接続、周囲の可燃部分との離隔を確認。見えない部分は図面や資料で確認。'],
      ['油脂除去装置・清掃状況','グリスフィルター等の有無と、天蓋・接続ダクト内部の油脂付着や清掃状況を確認。','', '条例第5条の2第1項第2号・第3号・第4号。油脂を含む蒸気が発生する設備が対象。ダクトを使わず天蓋から直接屋外に排気する場合は油脂除去装置に例外あり。'],
      ['排気ダクト・天蓋と可燃物の離隔','木製の壁・棚などとの最短距離を確認。','cm','条例第5条の2第1項第1号ウ。10cm以上。金属以外の不燃材料で有効に被覆した部分には例外あり。'],
      ['ダクトの接続と排気先','接続部の外れ・隙間、屋外への直接排気、他用途ダクトとの接続の有無を確認。','', '条例第5条の2第1項第1号イ・オ。見えない部分は図面等で照合。'],
      ['火炎伝送防止装置・自動消火装置','装置の有無を確認。要否を調べるときは用途・設置階・建物高さ・同一厨房室の合計入力をメモ。','', '条例第5条の2第1項第2号ウ・エ。自動消火装置は、同一厨房室の合計入力350kW以上で、条文に掲げる用途の地階、または高さ31mを超える建築物に設置する場合に該当条件を確認。火炎伝送防止装置には排気方式等による例外あり。']
    ]
  }
};
function ordinancePreviewPicker(x) {
  if (x.completedAt) return '';
  return `<div class="card"><h2>条例対象設備を選ぶ</h2>
    <form onsubmit="event.preventDefault();addOrdinancePreview(this)">
      <div class="field"><label for="ordinance-search">設備名・条番号で絞り込む</label>
      <input id="ordinance-search" type="search" placeholder="例：キュービクル、第15条" oninput="filterOrdinancePreview(this)"></div>
      <div class="field"><label for="ordinance-type">設備</label>
      <select id="ordinance-type" name="equipment" required>${ordinanceOptions('')}</select></div>
      <div class="field"><label for="ordinance-floor">階・屋上等（任意）</label><input id="ordinance-floor" name="floor" maxlength="20" placeholder="例：1階"></div>
      <div class="field"><label for="ordinance-location">設置場所</label>
      <input id="ordinance-location" name="location" required maxlength="80" placeholder="例：屋上、1階厨房"></div>
      <div class="field"><label for="ordinance-environment">屋内・屋外</label>
      <select id="ordinance-environment" name="environment">
        <option value="">不明・未確認</option><option value="indoor">屋内</option><option value="outdoor">屋外</option>
      </select></div>
      <button class="secondary">確認リストに追加</button>
    </form>
    ${(x.ordinancePreviewUnits||[]).map((unit,index)=>`<div class="row"><span>${esc([unit.floor,unit.location].filter(Boolean).join(' ／ '))} ／ ${ORDINANCE_TYPES[unit.type].title}（${ORDINANCE_TYPES[unit.type].article}）</span><button class="ghost" onclick="removeOrdinancePreview(${index})">取り消す</button></div>`).join('')}
    
  </div>`;
}
function ordinanceOptions(query) {
  const normalized = query.trim().normalize('NFKC').toLowerCase();
  return Object.entries(ORDINANCE_TYPES).filter(([, type]) =>
    `${type.title} ${type.article} ${type.keywords}`.normalize('NFKC').toLowerCase().includes(normalized)
  ).map(([key,type])=>`<option value="${key}">${type.title}｜${type.article}</option>`).join('');
}
function filterOrdinancePreview(input) {
  input.form.elements.equipment.innerHTML = ordinanceOptions(input.value);
}
function addOrdinancePreview(form) {
  const x = current();
  const {equipment, floor, location, environment} = form.elements;
  const type = ORDINANCE_TYPES[equipment.value];
  const place = location.value.trim();
  if (x.completedAt || !type || !place) return;
  const where = environment.value;
  const unit = {id:crypto.randomUUID(), type:equipment.value, floor:floor.value.trim(), location:place};
  const rows = [...type.common];
  if (equipment.value === 'transformer') {
    rows.push(...(type[where] || [
      ['屋内・屋外と適用条件','設置区分を確認し、屋内の区画・換気または屋外の離隔・外壁条件を台帳や図面と照合。']
    ]));
  }
  rows.push(['設置・変更届出との照合','管理基準の適用と別に、条例第51条の対象条件と台帳・届出内容を確認。']);
  x.ordinancePreviewUnits ||= [];
  x.ordinancePreviewUnits.push(unit);
  x.results ||= {};
  x.results[ORDINANCE_PREVIEW] ||= [];
  x.results[ORDINANCE_PREVIEW].push(...rows.map(([label, hint, detailKind, reference])=>({
    unit:unit.id, checkLabel:label, label:`${[unit.floor,place].filter(Boolean).join(' ／ ')} ／ ${type.title}（${type.article}）／ ${label}`,
    hint, detailKind, reference, measure:label==='建築物との離隔', value:'未確認', reason:'', note:''
  })));
  if (!x.equipments.includes(ORDINANCE_PREVIEW)) x.equipments.push(ORDINANCE_PREVIEW);
  x.ledgerChecked = false;
  changed('条例対象設備を追加');
  render();
}
function removeOrdinancePreview(index) {
  const x = current();
  const unit = x.ordinancePreviewUnits[index];
  if (x.completedAt || !unit || !confirm('この設備と確認結果を取り消しますか？')) return;
  x.ordinancePreviewUnits.splice(index,1);
  x.results[ORDINANCE_PREVIEW] = x.results[ORDINANCE_PREVIEW].filter(item=>item.unit!==unit.id);
  if (!x.ordinancePreviewUnits.length) x.equipments = x.equipments.filter(type=>type!==ORDINANCE_PREVIEW);
  x.ledgerChecked = false;
  changed('条例対象設備を取り消し');
  render();
}
function ordinancePreviewEvidence(item,index,readOnly) {
  const key = 'ordinance-' + index;
  const disabled = readOnly ? 'disabled' : '';
  const details = item.reference ? `<p class="small">${esc(item.reference)}</p>` : '';
  const face = item.detailKind === 'face' ? `<div class="field"><label for="${key}-face">面の用途</label>
    <select id="${key}-face" ${disabled} onchange="setItemText(ORDINANCE_PREVIEW,${index},'faceUse',this.value)">
    ${['未確認','操作','点検','換気','その他','兼用'].map(use=>`<option ${(item.faceUse||'未確認')===use?'selected':''}>${use}</option>`).join('')}</select></div>
    <div class="field"><label for="${key}-obstacle">支障物</label><input id="${key}-obstacle" ${disabled}
    value="${esc(item.obstacle||'')}" onchange="setItemText(ORDINANCE_PREVIEW,${index},'obstacle',this.value)"></div>` : '';
  const measured = item.detailKind === 'face' || item.detailKind === 'cm' ? `<div class="field">
    <label for="${key}-cm">実測距離（cm）</label><input id="${key}-cm" type="number" min="0" step="any"
    inputmode="decimal" ${disabled} value="${esc(item.distanceCm||'')}"
    onchange="if(this.reportValidity())setItemText(ORDINANCE_PREVIEW,${index},'distanceCm',this.value)"></div>` : '';
  return `<p class="small">${esc(item.hint)}</p>${details}${face}${measured}
  ${item.measure?`<div class="field"><label for="ordinance-distance-${index}">建築物との実測距離（m）</label>
  <input id="ordinance-distance-${index}" type="number" inputmode="decimal" step="any" min="0"
  value="${esc(item.distance||'')}" ${readOnly?'disabled':''}
  onchange="if(this.reportValidity())setItemText(ORDINANCE_PREVIEW,${index},'distance',this.value)"></div>`:''}`;
}
const CUSTOM = 'その他の確認項目';
const TYPES=['消火器','屋内消火栓設備','自動火災報知設備','火災通報装置','誘導灯','誘導標識','非常警報設備','条例・管理事項'];
const FIRE_USES=[['1イ','劇場・映画館など'],['1ロ','公会堂・集会場'],['2イ','キャバレーなど'],['2ロ','遊技場・ダンスホールなど'],['2ハ','性風俗関連店舗など'],['2ニ','カラオケボックスなど'],['3イ','料理店など'],['3ロ','飲食店'],['4','百貨店・物品販売店'],['5イ','旅館・ホテル'],['5ロ','共同住宅・寄宿舎'],['6イ1','病院など'],['6イ2','診療所など'],['6イ3','助産所など'],['6イ4','病院・診療所のうち上記以外'],['6ロ','自力避難困難者の入所施設など'],['6ハ','福祉施設など'],['6ニ','幼稚園・特別支援学校など'],['7','学校'],['8','図書館・博物館など'],['9イ','蒸気浴場など'],['9ロ','公衆浴場など'],['10','駅舎・空港など'],['11','神社・寺院など'],['12','工場・作業場'],['13イ','映画スタジオなど'],['13ロ','テレビスタジオなど'],['14','倉庫'],['15','事務所など'],['16イ','複合用途（特定用途を含む）'],['16ロ','複合用途（特定用途を含まない）'],['16の2','地下街'],['16の3','準地下街'],['17','重要文化財など'],['18','アーケード'],['19','山林'],['20','船舶・車両']];
const ORDINANCE_DETAILS = [
  ["火を使用する設備（条例第3〜22条）", [
  ["炉・焼却炉・工業炉","3","炉の種類、据付面積、燃料、可燃性ガス等の発生を確認。離隔・遮熱・燃料系統と設置届（第51条）を照合。"],
  ["ふろがま","4","燃料・設置状況を確認し、煙道・排気と可燃物との離隔を見る。"],
  ["温風暖房機","5","入力、風道の有無、設置先の用途を確認。排気経路と設置届（第51条）を照合。"],
  ["厨房設備・レンジ・フライヤー","5の2","厨房室ごとに入力を合計し、油脂を含む排気、天蓋・ダクト、清掃、消火装置の条件を確認。同一厨房室で合計350kW以上は第51条の届出対象。既存の設備別チェックも利用できます。"],
  ["ボイラー","6","設置場所、燃料、安全装置、排気を確認。個人の住居や労働安全衛生法令上の区分による第51条の届出除外を確認。"],
  ["据付型ストーブ・壁付暖炉","7・8","固定式の薪ストーブや壁付暖炉が候補。可燃物との離隔、遮熱、煙突を確認。移動式石油ストーブは第23条を確認。"],
  ["乾燥設備・サウナ設備","9・10","加熱方式、温度制御、安全装置、周囲の可燃物を確認。第51条の届出では個人の住居の除外を確認。"],
  ["簡易湯沸設備・給湯湯沸設備","11・12","機器の種類、入力、設置場所、給排気を確認。給湯湯沸設備は入力70kW以上の場合に第51条の届出条件・除外を確認。"],
  ["燃料電池発電設備","12の2","機器方式、出力、屋内外を確認。設置条件に応じた管理基準と第51条の届出除外を別々に確認。"],
  ["掘ごたつ・いろり","13","火床の不燃構造・被覆と、周囲の可燃物や清掃状況を確認。"],
  ["内燃機関式ヒートポンプ冷暖房機","13の2","銘板で内燃機関式か確認し、排気・周囲の離隔を確認。入力70kW以上は第51条の届出対象。"],

function ordinanceDetailRows(x) {
  return ORDINANCE_DETAILS.flatMap(([, rows]) => rows)
    .filter(([name]) => x.ordinance?.details?.includes(name));
}

function ordinanceDetailPicker(x) {
  return ORDINANCE_DETAILS.map(([category, rows], group) => {
    const count = rows.filter(([name]) => x.ordinance?.details?.includes(name)).length;
    return `<details class="card" id="ordinance-group-${group}" ${count ? 'open' : ''}>
      <summary>${category}${count ? `（${count}件選択）` : ''}</summary>
      ${rows.map(([name, article, hint], index) => `<div class="checkitem">
        <label class="equip"><input type="checkbox" ${x.ordinance?.details?.includes(name) ? 'checked' : ''}
          ${x.completedAt ? 'disabled' : ''} onchange="toggleOrdinanceDetail(${group},${index})">
          <span>${name}</span></label><p class="small">${hint} ${ordinanceArticleLink(ordinanceArticle(article))}</p>
      </div>`).join('')}
    </details>`;
  }).join('') + `<p class="small"><a href="${ORDINANCE_URL}" target="_blank" rel="noopener">所轄の火災予防条例（本文・別表）</a> ／
     <a href="https://www.hakusan-nonoichi.jp/shinsei/shinsei_index.htm" target="_blank" rel="noopener">届出様式</a></p>`;
}

function toggleOrdinanceDetail(group, index) {
  const x = current();
  if (!x || x.completedAt) return;
  const [name] = ORDINANCE_DETAILS[group][1][index];
  const label = ordinanceDetailLabel(ORDINANCE_DETAILS[group][1][index]);
  const selected = x.ordinance.details ||= [];
  const existing = x.results?.['条例・管理事項']?.find(item => item.label === label);
  if (selected.includes(name)) {
    if (existing && (existing.value !== '未確認' || existing.reason || existing.note || existing.photos?.length)
        && !confirm('この細目と入力済みの確認結果を削除しますか？')) {
      document.querySelectorAll('#ordinance-group-' + group + ' input')[index].checked = true;
      return;
    }
    x.ordinance.details = selected.filter(value => value !== name);
  } else {
    selected.push(name);
  }
  const labels = ordinanceChecks(x);
  const previous = x.results?.['条例・管理事項'] || [];
  x.results ||= {};
  x.results['条例・管理事項'] = labels.map(label => previous.find(item => item.label === label)
    || {label, value:'未確認', reason:'', note:''});
  if (!labels.length) x.equipments = x.equipments.filter(type => type !== '条例・管理事項');
  else if (!x.equipments.includes('条例・管理事項')) x.equipments.push('条例・管理事項');
  x.equipments.sort(compareEquipment);
  x.ledgerChecked = false;
  changed('条例の確認細目を更新');
  render();
  document.getElementById('ordinance-group-' + group).open = true;
}

function ordinanceArticle(article) {
  return article.split('・').map(part => part.split('〜').map(number => {
    const [main, suffix] = number.split('の');
    return '第' + main + '条' + (suffix ? 'の' + suffix : '');
  }).join('〜')).join('・');
}

function ordinanceDetailLabel([name, article]) {
  return name + '（' + ordinanceArticle(article) + '）';
}

function ordinanceDetailHint(item) {
  return ORDINANCE_DETAILS.flatMap(([, rows]) => rows)
    .find(row => ordinanceDetailLabel(row) === item.label)?.[2] || '';
}

    `<h3>${esc(place.name || '場所 ' + (index + 1))}</h3><ul>${place.items.map(row => {
      const item = getOrdinanceItem(row.item);
      return `<li>${item ? esc(item.name) : '品目未確認'} ／ ${item && row.amount !== '' ? esc(row.amount) + ' ' + item.unit : '数量未入力'}</li>`;
    }).join('')}</ul>${ordinanceQuantityResult(place)}`).join('')}</details>`;
}

      <label><input type="checkbox" ${place.residence ? 'checked' : ''} ${disabled} onchange="changeOrdinanceQuantity(this,${pi},'residence')"> 個人の住居（危険物の届出基準に反映）</label>

function getOrdinanceItem(key) {
  if (!/^[hc]\d+$/.test(key)) return null;
  const hazard = key.startsWith('h');
  const row = key && (hazard ? HAZARD_ITEMS : COMBUSTIBLE_ITEMS)[Number(key.slice(1))];
  if (!row) return null;
  const [name, threshold, unit = 'kg', special] = row;
  return {name, threshold, unit, hazard, special};
}

function ordinanceThreshold(item, residence) {
  const {threshold, unit, hazard, special} = item;
  const quantity = value => value.toLocaleString('ja-JP') + ' ' + unit;
  if (!hazard) return `指定可燃物の基準 ${quantity(threshold)}以上 ／ 届出基準 ${quantity(threshold * (special || 5))}以上`;
  return `指定数量 ${quantity(threshold)} ／ 単一品目の少量危険物の範囲 ${quantity(threshold / 5)}以上〜${quantity(threshold)}未満`
    + ` ／ 届出の下限 ${quantity(threshold * (residence ? 0.5 : 0.2))}`
    + (special ? ' ／ 動植物油類の管理は条例第38条の3・第40条の特則を確認' : '');
}

function ordinanceQuantityResult(place) {
  const items = place.items.map(row => ({item: getOrdinanceItem(row.item), amount: row.amount}));
  const entered = items.filter(({item, amount}) => item && amount !== '' && Number.isFinite(Number(amount)) && Number(amount) >= 0);
  const hazard = entered.filter(({item}) => item.hazard);
  const alerts = [];
  if (entered.length < items.length) alerts.push('品目・数量に未入力があります。入力済みの量で比較しています。');
  if (hazard.length) {
    const ratio = hazard.reduce((total, row) => total + Number(row.amount) / row.item.threshold, 0);
    const reaches = limit => Number(ratio.toPrecision(15)) >= limit;
    const status = reaches(1) ? '指定数量以上。少量危険物の範囲を外れています。許可・承認の有無を確認してください。'
      : reaches(0.2) ? '少量危険物の数量範囲です。届出基準と現況量を照合してください。'
      : '少量危険物の数量基準未満です。条例第36条の貯蔵・取扱基準を確認してください。';
    alerts.push(`危険物の合計 ${Number(ratio.toPrecision(15))}倍。 ${status}`);
    if (reaches(place.residence ? 0.5 : 0.2) && !reaches(1)) {
      alerts.push('入力済みの合計倍率は第54条の届出基準に達しています。届出書の数量・保管場所と照合してください。');
    }
    if (hazard.some(({item}) => item.special)) alerts.push('動植物油類を含みます。条例第38条の3・第40条の特則を確認してください。');
  }
  const combustible = new Map();
  for (const {item, amount} of entered.filter(({item}) => !item.hazard)) {
    const old = combustible.get(item.name);
    combustible.set(item.name, {item, amount: Number(amount) + (old?.amount || 0)});
  }
  for (const {item, amount} of combustible.values()) {
    const status = amount >= item.threshold * (item.special || 5) ? '指定可燃物に該当し、届出の数量基準以上'
      : amount >= item.threshold ? '指定可燃物に該当（届出の数量基準未満）' : 'この品目の指定可燃物の数量基準未満';
    alerts.push(item.name + ' ' + amount.toLocaleString('ja-JP', {maximumFractionDigits: 8}) + ' ' + item.unit + ' ／ ' + status);
  }
  return alerts.map(line => `<p class="warnbox">${esc(line)}</p>`).join('');
}

function updateOrdinanceQuantities(message) {
  changed(message);
  render();
}

function addOrdinanceQuantity(pi) {
  const x = current();
  if (!x || x.completedAt) return;
  const row = {item:'', amount:''};
  const places = x.ordinance.quantityPlaces ||= [];
  if (pi === undefined) places.push({name:'', residence:false, items:[row]});
  else places[pi].items.push(row);
  updateOrdinanceQuantities('条例の数量照合欄を追加');
}

function removeOrdinanceQuantity(pi, ri) {
  const x = current();
  if (!x || x.completedAt || !confirm('入力した数量照合の情報を削除しますか？')) return;
  const places = x.ordinance.quantityPlaces;
  if (ri === undefined) places.splice(pi, 1);
  else places[pi].items.splice(ri, 1);
  updateOrdinanceQuantities('条例の数量照合欄を削除');
}

function changeOrdinanceQuantity(input, pi, field, ri) {
  const x = current();
  if (!x || x.completedAt) return;
  const place = x.ordinance.quantityPlaces[pi];
  if (field === 'item') {
    place.items[ri] = {item: input.value, amount:''};
    updateOrdinanceQuantities('条例の数量照合の品目を変更');
    return;
  }
  if (field === 'residence') {
    place.residence = input.checked;
    updateOrdinanceQuantities('条例の数量照合の住居区分を変更');
    return;
  }
  if (field === 'name') place.name = input.value.trim();
  else place.items[ri].amount = input.validity.valid ? input.value : '';
  save();
  document.getElementById('ord-result-' + pi).innerHTML = ordinanceQuantityResult(place);
}

<label for="customItemLabel">候補にない設備・危険物など</label>
<input id="customItemLabel" name="itemLabel" required maxlength="100">
<button class="secondary">確認項目を追加</button></form>`}
<div class="card"><label><input type="checkbox" ${x.ledgerChecked?'checked':''} ${x.completedAt?'disabled':''} onchange="setLedgerStatus(this.checked)"> 台帳と照合済み</label></div>
${estimateDetails(x)}<div class="field"><label>全体メモ</label><textarea data-key="memo" ${x.completedAt?'disabled':''} placeholder="任意">${esc(x.memo)}</textarea></div><div class="field"><label>写真（任意）</label>${x.completedAt?'':`<input type="file" accept="image/*" capture="environment" id="photoIn">`}${x.photo?`<img class="photo" src="${x.photo}" alt="写真">`:''}</div><div class="actions"><button class="secondary" onclick="setPage('info')">← 検査情報</button><button onclick="startChecks()">点検項目へ →</button></div>`}
if(page==='checks'){const pages=inspectionPages(x), screen=pages[equipIndex];if(!screen){page='equip';return render()}const t=screen.type;let period=(x.periodChecks||{})[t]||{status:'未確認',note:''};
document.getElementById('screenTitle').textContent = screen.title;
const context = document.getElementById('screenContext');
context.textContent = screen.context || '';
context.hidden = !screen.context;
app.innerHTML=`<div class="row"><span class="sub">${equipIndex+1} / ${pages.length}${x.completedAt?' ・ 閲覧のみ':''}</span><button class="ghost" onclick="setPage('summary')">まとめ</button></div>
${screen.unit ? `<p>${ordinanceArticleLink(ORDINANCE_TYPES[screen.unit.type].article)} ・ ${ordinanceArticleLink('第51条（設置届）')}</p>` : screen.detail ? `<p>${ordinanceArticle(screen.detail[1]).split(/・|〜/).map(ordinanceArticleLink).join(' ／ ')}</p>` : ''}${t===EVACUATION?evacuationReferences():(t===CUSTOM||t===ORDINANCE_PREVIEW)?'':`<details class="card"><summary>確認ポイント・管理ポイント・法的根拠</summary><p><b>確認ポイント</b></p><ul>${(t==='条例・管理事項'?ordinanceChecks(x):CHECKS[t]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p><b>管理ポイント</b></p><p>${MANAGEMENT[t]} 具体的な適用条件や例外は、用途・構造・規模等を含めて法令と所轄消防本部の基準で確認してください。</p><p><a href="${GUIDANCE[t].url}" target="_blank" rel="noopener">${GUIDANCE[t].article}${t==='条例・管理事項'?'（PDF）':'（e-Gov）'}</a><br><a href="${GUIDANCE[t].guide}" target="_blank" rel="noopener">消防庁 点検基準・点検要領・点検票</a></p><p><b>よくある不備</b></p><ul>${GUIDANCE[t].common.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></details>`}${screen.detail?.[0]===ORDINANCE_DETAILS[2][1][0][0]?ordinanceQuantityPanel(x):''}${ledgerDifference(x)}${!hasPeriodCheck(x,t)?'':`<div class="card" id="period-check"><b>法定点検期間の確認</b><div class="field"><label>確認結果</label><select ${x.completedAt?'disabled':''} onchange="snapPeriodCheck('${esc(t)}','status',this.value)"><option ${period.status==='未確認'?'selected':''}>未確認</option><option ${period.status==='期間内'?'selected':''}>期間内</option><option ${period.status==='期間外'?'selected':''}>期間外</option></select></div><div class="field"><label>自由記載</label><textarea ${x.completedAt?'disabled':''} placeholder="確認内容など（任意）" onchange="snapPeriodCheck('${esc(t)}','note',this.value)">${esc(period.note||'')}</textarea></div></div>`}${screen.indexes.map(i=>{const a=x.results[t][i], label=inspectionItemName(screen,a);return `<div class="checkitem" id="item-${i}">${label?`<div class="checktitle">${esc(label)}</div>`:''}${t===EVACUATION?evacuationEvidence(a,i,x.completedAt):t===ORDINANCE_PREVIEW?ordinancePreviewEvidence(a,i,x.completedAt):t==='条例・管理事項'&&ordinanceDetailHint(a)?`<p class="small">${esc(ordinanceDetailHint(a))}</p>`:''}<div class="choices">${['良好','不備あり','要確認','該当なし','未確認'].map(v=>`<button class="choice ${a.value===v?'active':''}" data-v="${v}" ${x.completedAt?'disabled':''} onclick="setVerdict('${esc(t)}',${i},'${v}')">${v}</button>`).join('')}</div>${a.value==='不備あり'?`<div class="field itemreason"><label>不備理由（候補選択または自由入力・必須）</label><select ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)"><option value="">理由を選択してください</option>${(GUIDANCE[t]?.common || []).map(v=>`<option value="${esc(v)}" ${a.reason===v?'selected':''}>${esc(v)}</option>`).join('')}<option value="その他" ${a.reason==='その他'?'selected':''}>その他</option></select><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)" placeholder="その他の理由・補足">${esc(a.reason)}</textarea></div>`:''}${a.value==='要確認'?`<div class="field"><label>確認理由（任意）</label><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'reason',this.value)" placeholder="確認が必要な理由">${esc(a.reason)}</textarea></div>`:''}<div class="field"><label>メモ（任意）</label><textarea ${x.completedAt?'disabled':''} onchange="setItemText('${esc(t)}',${i},'note',this.value)" placeholder="補足">${esc(a.note)}</textarea></div><div class="field"><label>${t===EVACUATION?'現場写真（帰署後の検討用・任意）':'写真（任意・項目ごとに保存）'}</label>${x.completedAt?'':`<input type="file" accept="image/*" capture="environment" data-item-photo="${esc(t)}" data-item-index="${i}">`}${(a.photos||[]).map((src,j)=>`<span class="item-photo"><img class="item-photo-img" src="${src}" alt="${esc(a.label)}の写真">${x.completedAt?'':`<button type="button" class="ghost" onclick="removeItemPhoto('${esc(t)}',${i},${j})">削除</button>`}</span>`).join('')}</div></div>`}).join('')}<div class="actions"><button class="secondary" onclick="previousEquip()">${equipIndex?'← 前の項目':'← 検査項目'}</button><button onclick="nextEquip()">${equipIndex<pages.length-1?'次の項目 →':'まとめを確認 →'}</button></div>`}if(page==='summary'){app.innerHTML=`<div class="row"><span class="badge ${x.completedAt?'good':'warn'}">${x.completedAt?'完了（閲覧のみ）':'完了前'}</span></div>${summaryCard()}${ordinanceQuantitySummary(x)}${x.completedAt?`<h2>検査完了後メモ</h2><div class="field"><label>検査完了後に追記するメモ</label><textarea placeholder="結果は変更せず、補足事項を記録できます" onblur="savePostCompletionMemo(this)">${esc(x.postCompletionMemo||'')}</textarea></div>`:''}${!x.completedAt?`<div class="actions"><button class="secondary" onclick="setPage('equip')">設備・メモを修正</button><button onclick="finish()">検査完了</button></div>`:`<div class="actions"><button class="secondary" onclick="setPage('home')">一覧へ戻る</button></div>`}`}
if(page==='editEquip'){let t=ret;app.innerHTML=`${(x.results[t]||[]).map((a,i)=>`<div class="checkitem"><div class="checktitle">${esc(a.label)} <span class="badge">${a.value}</span></div>${a.reason?`<p class="small">${esc(a.reason)}</p>`:''}${a.note?`<p class="small">${esc(a.note)}</p>`:''}<button class="ghost" onclick="openReviewItem(${inspectionPages(x).findIndex(screen=>screen.type===t&&screen.indexes.includes(i))},'item-${i}')">内容を修正</button></div>`).join('')}<div class="actions"><button onclick="setPage('summary')">まとめへ戻る</button></div>`}
if(page!=='editEquip'){nav.classList.remove('hidden');nav.innerHTML=`<button class="secondary" onclick="setPage('info')">情報</button><button class="secondary" onclick="setPage('equip')">項目選択</button><button onclick="setPage('summary')">まとめ</button>`}
document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('change',()=>snapField(el.dataset.key,el.value));if(el.tagName==='TEXTAREA')el.addEventListener('input',()=>snapField(el.dataset.key,el.value))});let fi=document.getElementById('photoIn');if(fi)fi.onchange=()=>{let f=fi.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);x.photo=c.toDataURL('image/jpeg',.72);changed('写真を追加');render()};im.src=r.result};r.readAsDataURL(f)};document.querySelectorAll('[data-item-photo]').forEach(input=>input.addEventListener('change',()=>storeItemPhoto(input)));
}
function storeItemPhoto(input){let file=input.files?.[0];if(!file)return;let t=input.dataset.itemPhoto,i=Number(input.dataset.itemIndex),x=current(),item=x?.results?.[t]?.[i];if(!item||x.completedAt)return;let reader=new FileReader();reader.onload=()=>{let image=new Image();image.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,900/Math.max(image.width,image.height));canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let previous=item.photos||[];item.photos=[...previous,canvas.toDataURL('image/jpeg',.65)];x.history.push({at:new Date().toISOString(),message:`${t}「${item.label}」に写真を追加`});try{save();render()}catch(e){item.photos=previous;x.history.pop();alert('端末内の保存容量が不足しています。不要な写真を削除してから再度お試しください。');render()}};image.onerror=()=>alert('写真を読み込めませんでした。別の写真を選んでください。');image.src=reader.result};reader.readAsDataURL(file)}function removeItemPhoto(t,i,j){let x=current(),item=x?.results?.[t]?.[i];if(!item||x.completedAt||!item.photos?.[j])return;if(!confirm('この項目の写真を削除しますか？'))return;item.photos.splice(j,1);x.history.push({at:new Date().toISOString(),message:`${t}「${item.label}」の写真を削除`});save();render()}function addPerson(){let v=document.getElementById('personNew').value.trim();if(v&&!data.people.includes(v)){data.people.push(v);save();render()}}
function removePerson(p){data.people=data.people.filter(x=>x!==p);save();render()}
function openInspection(i){id=i;setPage(current().completedAt?'summary':'info')}
function deleteInspection(i){if(confirm('この検査記録を削除しますか？')){data.inspections=data.inspections.filter(x=>x.id!==i);save();render()}}
function applySuggestedEquipment(){let x=current();if(!x||x.completedAt)return;let added=[];x.equipments=x.equipments||[];x.results=x.results||{};for(let r of estimateEquipment(x).filter(r=>r.hit)){if(!x.equipments.includes(r.name)){x.equipments.push(r.name);added.push(r.name)}if(!x.results[r.name])x.results[r.name]=CHECKS[r.name].map(label=>({label,value:'未確認',reason:'',note:''}))}x.equipments.sort(compareEquipment);if(added.length){x.ledgerChecked=false;changed('全国基準目安の候補を追加: '+added.join('、'))}else save();render()}
function compareEquipment(a,b){const order = [...TYPES, EVACUATION, ORDINANCE_PREVIEW, CUSTOM];return order.indexOf(a)-order.indexOf(b)}
function startChecks(){if(!inspectionPages(current()).length){setPage('summary');return}current().equipments.sort(compareEquipment);equipIndex=0;setPage('checks')}
function setVerdict(t,i,v){let x=current();if(x.completedAt)return;x.results[t][i].value=v;changed(`${t}「${x.results[t][i].label}」を${v}に変更`);render()}
function setItemText(t,i,k,v){let x=current();if(x.completedAt)return;x.results[t][i][k]=v;changed(`${t}「${x.results[t][i].label}」の記述を更新`)}
function previousEquip(){if(!equipIndex){setPage('equip');return}equipIndex--;setPage('checks')}
function nextEquip(){const x=current();if(!x){setPage('equip');return}if(equipIndex<inspectionPages(x).length-1){equipIndex++;setPage('checks')}else setPage('summary')}
function editEquip(t){ret=t;setPage('editEquip')}
function savePostCompletionMemo(el){let x=current();if(!x?.completedAt||x.postCompletionMemo===el.value)return;x.postCompletionMemo=el.value;x.history.push({at:new Date().toISOString(),message:'検査完了後メモを更新'});save()}function finish(){let x=current();let missing=x.equipments.flatMap(t=>x.results?.[t]||[]).filter(a=>a.value==='不備あり'&&(!String(a.reason||'').trim()||String(a.reason).trim()==='その他'));if(missing.length){alert('不備理由が未入力の項目が '+missing.length+' 件あります。理由を入力してください。');return}if(!confirm('検査を完了しますか？完了後は編集できません。'))return;x.completedAt=new Date().toISOString();changed('検査を完了（以降閲覧のみ）');setPage('summary')}
clean();render();
</script>
